# nginx reverse proxy para RustyAlarm.
# Copiar a /etc/nginx/sites-available/rustyalarm y enlazar:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rustyalarm
#   sudo ln -s /etc/nginx/sites-available/rustyalarm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU_DOMINIO      # agrega el bloque 443 + redirect solo
#
# Reemplazar TU_DOMINIO por el dominio real (ej: alarmas.midominio.com).
# certbot reescribe este archivo para sumar HTTPS; despues de correrlo,
# BASE_URL en .env tiene que ser https://TU_DOMINIO

# Rate limit para rutas sensibles (login/API): 10 req/s por IP con ráfaga.
# Definido a nivel http{}, se aplica con limit_req en las locations de abajo.
limit_req_zone $binary_remote_addr zone=rustyalarm:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    server_tokens off;                 # no revelar la version de nginx

    # Limite de subida chico: la API solo recibe JSON pequeno.
    client_max_body_size 64k;

    # certbot agrega aca, en el bloque 443, la linea de HSTS:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # Throttle en login y API (session mint, relay a Discord, alta de alarmas).
    location ~ ^/(login|auth/steam/return|api/) {
        limit_req zone=rustyalarm burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
