<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RustyAlarm{% endblock %}</title>
<link rel="stylesheet" href="/static/fa/css/all.min.css">
<style>
  :root {
    /* Tipografía: sans para todo, monoespaciada para telemetría (IDs, estado,
       timestamps). El mono es la firma tipográfica — consola de monitoreo. */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;

    /* Superficies: dark cálido en capas */
    --bg: #121010;
    --surface-1: #1a1714;
    --surface-2: #221d19;
    --surface-3: #2b251f;
    --line: #322c25;
    --line-2: #453d33;

    --text: #f1ece4;
    --text-dim: #b7ab9d;
    --text-mute: #877c6f;

    /* Acento Rust + estados */
    --rust: #db4325;
    --rust-bright: #ff6a44;
    --rust-deep: #b0341b;
    --rust-tint: rgba(219, 67, 37, .14);
    --signal: #79d38d;
    --signal-tint: rgba(121, 211, 141, .13);
    --amber: #e7a63c;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 10px 30px -12px rgba(0, 0, 0, .6);
    --shadow-pop: 0 24px 70px -20px rgba(0, 0, 0, .72);

    --r-sm: 7px; --r: 10px; --r-lg: 14px; --r-pill: 999px;

    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --ease-in-out: cubic-bezier(.77, 0, .175, 1);
    --t-fast: 130ms; --t: 200ms; --t-slow: 300ms;

    /* Alias de nombres viejos para no romper el CSS existente de las páginas */
    --panel: var(--surface-1);
    --panel-2: var(--surface-2);
    --muted: var(--text-dim);
    --accent: var(--rust);
    --accent-soft: var(--rust-bright);
    --ok: var(--signal);
    --warn: var(--amber);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 78% -8%, rgba(219, 67, 37, .10), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.55 var(--font-sans);
    letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }
  a { color: var(--rust-bright); }
  ::selection { background: var(--rust-tint); }

  /* Telemetría / etiquetas técnicas */
  .mono { font-family: var(--font-mono); font-feature-settings: "ss01"; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--text-mute);
  }
  .muted { color: var(--text-dim); }

  /* La firma: señal viva de monitoreo */
  .signal {
    position: relative; width: 8px; height: 8px; border-radius: 50%;
    background: var(--signal); flex: none;
  }
  .signal::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 1px solid var(--signal); opacity: .6;
    animation: signalPulse 2.4s var(--ease-out) infinite;
  }
  .signal.rust { background: var(--rust-bright); }
  .signal.rust::after { border-color: var(--rust-bright); }
  .signal.idle { background: var(--text-mute); }
  .signal.idle::after { animation: none; opacity: 0; }
  @keyframes signalPulse {
    0% { transform: scale(.7); opacity: .7; }
    70%, 100% { transform: scale(2.1); opacity: 0; }
  }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 26px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface-1) 82%, transparent);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 20;
  }
  header .brand {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 16px; font-weight: 700; letter-spacing: -0.02em;
    color: var(--text); text-decoration: none;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .spacer { flex: 1; }

  button, .btn {
    --_bg: var(--surface-2); --_bd: var(--line-2);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 9px 15px; border-radius: var(--r-sm);
    border: 1px solid var(--_bd); background: var(--_bg);
    color: var(--text); font: inherit; font-weight: 600; letter-spacing: -0.01em;
    cursor: pointer; text-decoration: none;
    transition: transform var(--t-fast) var(--ease-out),
                border-color var(--t) var(--ease-out),
                background var(--t) var(--ease-out), opacity var(--t) var(--ease-out);
  }
  button:disabled, .btn:disabled { opacity: .4; cursor: not-allowed; }
  button:active:not(:disabled), .btn:active { transform: scale(.97); }
  button:focus-visible, .btn:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--rust-bright); outline-offset: 2px;
  }
  @media (hover: hover) and (pointer: fine) {
    button:hover:not(:disabled), .btn:hover { border-color: var(--rust-bright); }
  }
  .primary {
    --_bg: linear-gradient(180deg, var(--rust-bright), var(--rust));
    --_bd: var(--rust-deep);
    color: #fff; box-shadow: var(--shadow-1), inset 0 1px 0 rgba(255, 255, 255, .18);
  }
  @media (hover: hover) and (pointer: fine) {
    .primary:hover { border-color: var(--rust-deep); filter: brightness(1.06); }
  }
  .ghost { --_bg: transparent; --_bd: var(--line); }
  .danger { color: var(--rust-bright); }

  #toast {
    position: fixed; right: 22px; bottom: 22px; max-width: 380px; z-index: 90;
    padding: 13px 16px; border-radius: var(--r); border: 1px solid var(--line-2);
    background: var(--surface-2); color: var(--text); font-size: 14px;
    box-shadow: var(--shadow-pop);
    display: flex; align-items: center; gap: 10px;
    opacity: 0; transform: translateY(10px);
    transition: opacity var(--t) var(--ease-out), transform var(--t) var(--ease-out);
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-mute); flex: none;
  }
  #toast.ok { border-color: color-mix(in srgb, var(--signal) 55%, var(--line-2)); }
  #toast.ok::before { background: var(--signal); }
  #toast.error { border-color: color-mix(in srgb, var(--rust) 60%, var(--line-2)); }
  #toast.error::before { background: var(--rust-bright); }

  /* Reveal al hacer scroll (lo activa el observer de abajo) */
  [data-reveal] {
    opacity: 0; transform: translateY(10px);
    transition: opacity var(--t-slow) var(--ease-out), transform var(--t-slow) var(--ease-out);
  }
  [data-reveal].is-in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    [data-reveal] { opacity: 1; transform: none; }
  }
  {% block style %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
<div id="toast"></div>
<script>
function toast(message, kind) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.className = kind || "";
  // reflow para reiniciar la transición si ya estaba visible
  void el.offsetWidth;
  el.classList.add(kind || "_", "show");
  el.classList.remove("_");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove("show"), 4000);
}
async function api(path, options) {
  const res = await fetch(path, options);
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.fields = data.errors || {};
    throw err;
  }
  return data;
}
function send(path, method, body) {
  return api(path, {
    method,
    headers: {"Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
}
// Reveal on scroll — decorativo, una sola vez, respeta reduced-motion vía CSS.
(function () {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("is-in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -8% 0px" });
  const start = () => document.querySelectorAll("[data-reveal]").forEach((el) => io.observe(el));
  if (document.readyState !== "loading") start();
  else document.addEventListener("DOMContentLoaded", start);
})();
</script>
{% block script %}{% endblock %}
</body>
</html>
